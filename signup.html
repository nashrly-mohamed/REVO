
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنشاء حساب - REVO</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#101820;
color:white;
font-family:Arial,Tahoma,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}
.container{
width:100%;
max-width:430px;
background:#1b2934;
padding:28px;
border-radius:20px;
box-shadow:0 10px 35px #0005;
}
.logo{
text-align:center;
font-size:32px;
font-weight:bold;
color:#19d6c1;
margin-bottom:8px;
}
.logo span{color:white}
h2{text-align:center}
p{text-align:center;color:#aab5bd}
label{display:block;margin:15px 0 7px;color:#19d6c1}
input,select{
width:100%;
padding:14px;
border:1px solid #344653;
border-radius:10px;
background:#101820;
color:white;
font-size:16px;
}
button{
width:100%;
padding:15px;
margin-top:22px;
background:#19d6c1;
border:0;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
#message{
text-align:center;
color:#19d6c1;
line-height:1.8;
}
a{color:#19d6c1}
</style>
</head>
<body>
<div class="container">
<div class="logo">REVO <span>ريفو</span></div>
<h2>إنشاء حساب جديد</h2>
<p>أهلاً بيك في ريفو.. مشوارك يبدأ معانا</p>

<form id="signupForm">
<label>الاسم بالكامل</label>
<input id="name" type="text" placeholder="اكتب اسمك" required>

<label>رقم الموبايل</label>
<input id="phone" type="tel" placeholder="01xxxxxxxxx" required>

<label>المنطقة</label>
<select id="area" required>
<option value="">اختار منطقتك</option>
<option>حدائق الأهرام</option>
<option>الهرم</option>
<option>فيصل</option>
</select>

<label>كلمة المرور</label>
<input id="password" type="password" placeholder="8 أحرف على الأقل" minlength="8" required>

<button type="submit">إنشاء حساب</button>
</form>

<p id="message"></p>
<p><a href="index.html">العودة للصفحة الرئيسية</a></p>
</div>

<script>
document.getElementById('signupForm').addEventListener('submit',function(e){
e.preventDefault();
document.getElementById('message').innerText=
'تم إدخال بياناتك بنجاح تجريبياً. تسجيل الحساب الحقيقي قريباً.';
});
</script>
</body>
</html>
